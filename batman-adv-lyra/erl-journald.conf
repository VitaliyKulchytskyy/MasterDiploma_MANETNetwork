# Installed as /etc/systemd/journald.conf.d/erl.conf
# Keep logs across power cuts: the board is powered through the same USB-C
# port the phone/PC uses, so moving the cable reboots it. Capped for the SD card,
# and synced every 10 s (default 5 min) so a session on the phone is not lost.
[Journal]
Storage=persistent
SystemMaxUse=50M
SyncIntervalSec=10s
