# Installed as /etc/NetworkManager/conf.d/90-erl-tether.conf
# The image leaves every wired device unmanaged; additionally let NM manage
# (DHCP) the link a phone creates in USB tethering mode. The board's own
# gadget links (usb0 rndis, usb1 ncm) use other drivers and stay unmanaged.
[keyfile]
unmanaged-devices=*,except:type:wifi,except:type:gsm,except:type:cdma,except:driver:rndis_host,except:driver:cdc_ether,except:driver:cdc_ncm
