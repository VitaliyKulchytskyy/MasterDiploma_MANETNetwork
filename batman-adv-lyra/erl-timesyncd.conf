# Installed as /etc/systemd/timesyncd.conf.d/erl.conf
# The board has no RTC, so the clock is only right after an NTP sync. Several servers, in case
# one is unreachable through the phone / mesh uplink, and quick retries while none answers
# (erl-inet also restarts timesyncd when the internet comes up and the clock is not synced).
[Time]
FallbackNTP=ntp.ubuntu.com 0.pool.ntp.org 1.pool.ntp.org time.cloudflare.com time.google.com
ConnectionRetrySec=15
